<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah's Detailing Service</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:Montserrat,sans-serif;
  background:#0b0b0b;
  color:white;
}

/* NAV */
nav {
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.95);
  padding:14px;
  text-align:center;
  z-index:999;
}
nav a {
  color:white;
  margin:0 15px;
  text-decoration:none;
  font-weight:600;
}
nav a:hover {color:#ffce00;}

/* URGENCY BAR */
.topbar {
  background:#ffce00;
  color:black;
  text-align:center;
  padding:8px;
  font-weight:bold;
}

/* HERO */
header {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
  linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.9)),
  url('https://images.unsplash.com/photo-1601933470928-c8db2a3d175e?auto=format&fit=crop&w=1500&q=80')
  center/cover no-repeat;
}

.hero h1 {
  font-size:3.2rem;
  animation:fade 1s ease;
}
.hero p {
  color:#ccc;
  margin-top:10px;
  animation:fade 1.2s ease;
}

.btn {
  margin-top:20px;
  display:inline-block;
  background:#ffce00;
  color:black;
  padding:12px 25px;
  border-radius:8px;
  font-weight:bold;
  text-decoration:none;
  transition:0.2s;
}
.btn:hover {transform:scale(1.05);}

/* SECTIONS */
section {
  padding:80px 20px;
  text-align:center;
}

h2 {
  font-size:2rem;
  margin-bottom:20px;
  letter-spacing:1px;
}

.grid {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.card {
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
  max-width:320px;
  transition:0.3s;
}
.card:hover {
  transform:translateY(-10px);
  background:#222;
}

/* FLOAT BUTTON */
.float {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ffce00;
  color:black;
  padding:15px 18px;
  border-radius:50px;
  font-weight:bold;
  text-decoration:none;
  z-index:9999;
}

/* ANIMATION */
@keyframes fade {
  from {opacity:0; transform:translateY(25px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="topbar">🚗 Mobile Detailing Available — We Come To You</div>

<nav>
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>

</nav>

<header>
  <div class="hero">
    <h1>Premium Mobile Detailing</h1>
    <p>We Restore Your Car To A Showroom Finish — At Your Doorstep</p>
    <a class="btn" href="contact.html">Book Now</a>
  </div>
</header>

<section>
  <h2>Why Choose Us</h2>
  <div class="grid">
    <div class="card">🚗 We Come To You</div>
    <div class="card">✨ Premium Quality Work</div>
    <div class="card">💰 Fair Pricing</div>
    <div class="card">⚡ Fast & Reliable</div>
  </div>
</section>

<a class="float" href="sms:5187744178">💬 Text Me</a>

</body>
</html>
